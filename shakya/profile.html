        <section class="profile-section">
            <marquee behavior="alternate direction=left onmouseover=this.stop();onmouseover=this.start();"><h1>Welcome To Profile</h1></marquee>
            <div class="profile-container">
                <label for="profileImage" class="profile-label">
                  <img id="profileDisplay" src="profile.html" alt="Chose File" class="profile-img">
                </label>
                <input type="file" id="profileImage" class="file-input" accept="image/*" onchange="displayImage(this)">
                
                <button class="Edit" onclick="document.getElementById('profileImage').click();">Edit</button>
              </div>
              <span class="profile-text">Profile Picture</span>
              <br>
            
           
    <form class="profile-form" action="insertprofile.php" method="post" enctype="multipart/form-data">
    <h2 align="center">My Profile</h2>
    <div class="form-group">
        <div>
            <label for="first-name"><b>First Name</b></label>
            <input type="text" id="first-name" name="first-name" placeholder="e.g., First Name" required>
        </div>
        <div>
            <label for="last-name"><b>Last Name</b></label>
            <input type="text" id="last-name" name="last-name" placeholder="e.g., Last Name" required>
        </div>
    </div>
    
    <div class="form-group">
        <div>
            <label for="email"><b>Email</b></label>
            <input type="email" id="email" name="email" placeholder="mail@example.com" required>
        </div>
        <div>
            <label for="password"><b>Password</b></label>
            <input type="password" id="password" name="password" placeholder="Minimum of 8 characters" required>
        </div>
    </div>
    
    <div class="form-group">
        <label for="phone-number"><b>Phone Number</b></label>
        <input type="tel" id="phone-number" name="phone-number" placeholder="Enter your phone number" required>
    </div>

    <div class="form-group">
        <label for="registered-date"><b>Registered Date</b></label>
        <input type="date" id="registered-date" name="registered-date" required>
    </div>

    <div class="form-group">
        <label><b>Gender</b></label>
        <div>
            <label for="male">
                <input type="radio" id="male" name="gender" value="male" checked> Male
            </label>
        </div>
        <div>
            <label for="female">
                <input type="radio" id="female" name="gender" value="female"> Female
            </label>
        </div>
    </div>

    <div class="form-group">
        <label for="dob"><b>Date of Birth</b></label>
        <input type="date" id="dob" name="dob" required>
    </div>

    <div class="form-group">
        <label for="address-line1"><b>Address Line 1</b></label>
        <input type="text" id="address-line1" name="address-line1" placeholder="Address Line 1" required>
    </div>

    <div class="form-group">
        <label for="address-line2"><b>Address Line 2</b></label>
        <input type="text" id="address-line2" name="address-line2" placeholder="Address Line 2">
    </div>

    <div class="form-group">
        <label for="city"><b>City</b></label>
        <input type="text" id="city" name="city" placeholder="City" required>
    </div>
    
    <button type="submit" value="Update" class="save-button" align="center">Submit</button>
</form>
